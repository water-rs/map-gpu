# The toolchain is a property of this repository, not of whoever checked it out.
#
# CI lints and tests on `dtolnay/rust-toolchain@stable`, and clippy's findings
# differ between channels in both directions. An explicit `+toolchain` always
# wins over this file when a task genuinely needs another channel.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
