[package]
name = "waterui-map-gpu"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/map-gpu"
description = "GPU-drawn MapLibre vector map realization for WaterUI"
keywords = ["map", "vector-tiles", "cherenkov", "waterui"]
categories = ["gui", "graphics"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = []

[dependencies]
blocking = "1.7.0"
executor-core = "0.7.1"
futures = "0.3"
futures-lite = "2.6"
geo = { version = "0.32", default-features = false }
geo-types = "0.7"
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
kurbo = "0.13"
lru = "0.16"
maplibre-expr = "0.3.2"
mvt-reader = "2.4.0"
nami = "0.12"
native-executor = "0.8.0"
parley = { version = "0.11", default-features = false, features = ["system"] }
rayon = "1.12"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
thiserror = "2.0.19"
tracing = "0.1.44"
url = "2.5"
waterui-core = { version = "0.5.0" }
waterui-graphics = { version = "0.5.0" }
waterui-map = { version = "0.5.0" }
waterui-url = { version = "0.5.0", features = ["std"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
zenwave = { version = "0.6.1", default-features = false, features = ["hyper-backend", "native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
zenwave = { version = "0.6.1", default-features = false, features = ["hyper-backend", "rustls"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(any(target_vendor = "apple", target_os = "android"))))'.dependencies]
zenwave = { version = "0.6.1", default-features = false, features = ["hyper-backend", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
web-time = "1"
zenwave = { version = "0.6.1", default-features = false }

[dev-dependencies]
num-traits = { version = "0.2", default-features = false }
pollster = "1.0"
# The `gpu` and `cpu` features add the `OffscreenRenderer` backends the
# offscreen snapshot test renders through (Metal GPU and CPU rasterizer).
waterui-graphics = { version = "0.5.0", features = ["cpu", "gpu"] }
# `tests/map_semantics.rs` mounts through `waterui-testing` on the pinned
# Hydrolysis host.
waterui = "0.5.0"
waterui-testing = "0.5.0"

[package.metadata.waterui.permissions]
internet = { reason = "downloads map styles and vector tiles" }

[package.metadata.cargo-machete]
ignored = ["getrandom"]

# Registry dependencies do not carry their own patch table, so the framework's
# pins are repeated here for this graph to resolve the same sources as
# water-rs/waterui at `cc756f574`: every `waterui-*` crate this crate reaches,
# directly or transitively, is the same monorepo commit. Cherenkov, filtrate
# and hydrolysis live in that repository — the engine family under
# `graphics/` and the backend under `backends/hydrolysis` — so their
# requirements resolve there too (water-rs/waterui#1449).
[patch.crates-io]
# water-rs/waterui on `deps/1832-nami-0.12`, which moves the framework to
# nami 0.12 / nami-core 0.4 from crates.io (water-rs/waterui#1832) on top of
# the render-target-neutral contract of water-rs/waterui#1435: `SceneContent`
# records into the `cherenkov_record` `Recorder` re-exported as
# `waterui_graphics::draw` and `SceneResources` registers through the
# target's `SceneBackend` / `ShaderBackend` registry, returning handles that
# name the plain ids.
waterui = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }

# Split components at the revisions the pinned waterui workspace consumes.
# `hydrolysis` enters this graph only through `waterui-testing`, whose
# workspace dependency already resolves it in-tree at the same revision.
waterui-image = { git = "https://github.com/water-rs/image", rev = "8b1aa2ce3f03d81ca02164f5563f2cefc34fb566" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "16f99e021f735d0b1b31c95552b074e953d56418" }

# The engine and its filter crates live in the waterui repository under
# `graphics/` and resolve to the same revision as the rest of the graph.
cherenkov = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
cherenkov-cpu = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
filtrate = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
filtrate-core = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", rev = "cc756f5745eb8841d33e54c7305d00c8e616a32e" }

# suiteki 0.1.1 on crates.io implements nami-core 0.3's `Signal`; suiteki dev
# at the merge of water-rs/suiteki#27 implements 0.4's, the rev the
# framework's own table pins. Drop once a release carries it.
suiteki = { git = "https://github.com/water-rs/suiteki", rev = "7cf17bdba0e978d388a096b1916daebdc17253b4" }
# shaderloom's `runtime` feature is newer than its registry release; this is
# the rev the framework's own table pins.
shaderloom = { git = "https://github.com/water-rs/shaderloom", rev = "b0b6870c8b560d902c1de9a4d039c3a921b18b92" }

# water-rs/waterkit dev on nami 0.12 (the merge of water-rs/waterkit#140),
# the rev the framework's own table pins — one revision serves every
# waterkit crate the graph reaches so the shared types stay identical.
waterkit-build = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-core = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-permission = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-video-core = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }



# Mirrored from water-rs/waterui's workspace [patch.crates-io] (itself
# mirrored from the cherenkov workspace's table, water-rs/cherenkov#229).
# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). The fork carries only that backport on the
# v30.0.1 tag; drop these entries once wgpu-hal 30.0.2 ships it.
naga = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-wasm = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
