[package]
name = "waterui-map-gpu"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/map-gpu"
description = "GPU-drawn MapLibre vector map realization for WaterUI"
keywords = ["map", "vector-tiles", "cherenkov", "waterui"]
categories = ["gui", "graphics"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = []
# The mounted-runtime test in `tests/map_semantics.rs`. It mounts through
# `waterui-testing`, which pulls `hydrolysis` — and no hydrolysis revision
# compiles against the pinned waterui revision yet (it still implements the
# retired `Scene2D` contract), so this target is the one piece of the crate
# that does not build under `--all-features`. When a hydrolysis revision
# lands that implements the new `SceneContent` contract, declare the host
# dev-deps below and this builds.
host-e2e = []

[dependencies]
blocking = "1.7.0"
cherenkov = "0.0.0"
executor-core = "0.7.1"
futures = "0.3"
futures-lite = "2.6"
geo = { version = "0.32", default-features = false }
geo-types = "0.7"
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
kurbo = "0.13"
lru = "0.16"
maplibre-expr = "0.3.2"
mvt-reader = "2.4.0"
nami = "=0.11.1"
native-executor = "0.8.0"
parley = { version = "0.11", default-features = false, features = ["system"] }
rayon = "1.12"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
thiserror = "2.0.19"
tracing = "0.1.44"
url = "2.5"
waterui-core = { version = "0.5.0" }
waterui-graphics = { version = "0.5.0" }
waterui-map = { version = "0.5.0" }
waterui-url = { version = "0.5.0", features = ["std"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
zenwave = { version = "0.6.1", default-features = false, features = ["hyper-backend", "native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
zenwave = { version = "0.6.1", default-features = false, features = ["hyper-backend", "rustls"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(any(target_vendor = "apple", target_os = "android"))))'.dependencies]
zenwave = { version = "0.6.1", default-features = false, features = ["hyper-backend", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
web-time = "1"
zenwave = { version = "0.6.1", default-features = false }

[dev-dependencies]
num-traits = { version = "0.2", default-features = false }
pollster = "1.0"
# The `gpu` and `cpu` features add the `OffscreenRenderer` backends the
# offscreen snapshot test renders through (Metal GPU and CPU rasterizer).
waterui-graphics = { version = "0.5.0", features = ["cpu", "gpu"] }

# Dev-deps for the `host-e2e` feature — absent on purpose: every available
# hydrolysis revision still implements `Scene2D` and cannot compile against
# the pinned waterui, so declaring any of them would poison the dev graph for
# every test target. Restore them, pinned to the revision the host port
# produces, when it lands:
#
#   waterui = "0.5.0"
#   waterui-testing = "0.5.0"

[package.metadata.waterui.permissions]
internet = { reason = "downloads map styles and vector tiles" }

[package.metadata.cargo-machete]
ignored = ["getrandom"]

# Registry dependencies do not carry their own patch table, so the framework's
# pins are repeated here for this graph to resolve the same sources as
# water-rs/waterui `dev` at the pinned revision: every `waterui-*` crate this
# crate reaches, directly or transitively, is the same monorepo commit, and
# the engine trio is the Cherenkov revision the port targets.
[patch.crates-io]
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "e5801bad2c29cc2c0ff1ecbe3110e3224ea85029" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "e5801bad2c29cc2c0ff1ecbe3110e3224ea85029" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "e5801bad2c29cc2c0ff1ecbe3110e3224ea85029" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "e5801bad2c29cc2c0ff1ecbe3110e3224ea85029" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "e5801bad2c29cc2c0ff1ecbe3110e3224ea85029" }

cherenkov = { git = "https://github.com/water-rs/cherenkov", rev = "283124ff448120d6ba2e0a8556832bb65e30e86a" }
cherenkov-cpu = { git = "https://github.com/water-rs/cherenkov", rev = "283124ff448120d6ba2e0a8556832bb65e30e86a" }
cherenkov-gpu = { git = "https://github.com/water-rs/cherenkov", rev = "283124ff448120d6ba2e0a8556832bb65e30e86a" }
filtrate = { git = "https://github.com/water-rs/cherenkov", rev = "283124ff448120d6ba2e0a8556832bb65e30e86a" }
filtrate-core = { git = "https://github.com/water-rs/cherenkov", rev = "283124ff448120d6ba2e0a8556832bb65e30e86a" }
filtrate-derive = { git = "https://github.com/water-rs/cherenkov", rev = "283124ff448120d6ba2e0a8556832bb65e30e86a" }

# The nami `kurbo` feature Cherenkov requires is unreleased (water-rs/nami#27);
# this revision is the one the pinned monorepo declares, and it contains the
# engine's own pin, so one nami serves both.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }

# `waterui-map` reaches `waterkit-location` for user location; the waterkit
# crates share types, so both pins are the waterkit revision the pinned
# monorepo declares.
waterkit-core = { git = "https://github.com/water-rs/waterkit", rev = "f48ab29c10e0c7214aa6850c024eab2b4cbb43ae" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", rev = "f48ab29c10e0c7214aa6850c024eab2b4cbb43ae" }

# Third-party forks the framework itself patches; not reached by the current
# graph, kept for the `host-e2e` dev-deps they come back with.
xcb = { git = "https://github.com/rust-x-bindings/rust-xcb", rev = "ae3b2cd080e78173223038ccbebdc644eaf4a9ad" }
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
