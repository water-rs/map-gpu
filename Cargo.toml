[package]
name = "waterui-map-gpu"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/map-gpu"
description = "GPU-drawn MapLibre vector map realization for WaterUI"
keywords = ["map", "vector-tiles", "cherenkov", "waterui"]
categories = ["gui", "graphics"]

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[features]
default = []

[dependencies]
blocking = "1.7.0"
executor-core = "0.7.1"
futures = "0.3"
futures-lite = "2.6"
geo = { version = "0.32", default-features = false }
geo-types = "0.7"
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
kurbo = "0.13"
lru = "0.16"
maplibre-expr = "0.3.2"
mvt-reader = "2.4.0"
nami = "=0.11.1"
native-executor = "0.8.0"
parley = { version = "0.11", default-features = false, features = ["system"] }
rayon = "1.12"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
thiserror = "2.0.19"
tracing = "0.1.44"
url = "2.5"
waterui-core = { version = "0.5.0" }
waterui-graphics = { version = "0.5.0" }
waterui-map = { version = "0.5.0" }
waterui-url = { version = "0.5.0", features = ["std"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
zenwave = { version = "0.6.1", default-features = false, features = ["hyper-backend", "native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
zenwave = { version = "0.6.1", default-features = false, features = ["hyper-backend", "rustls"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(any(target_vendor = "apple", target_os = "android"))))'.dependencies]
zenwave = { version = "0.6.1", default-features = false, features = ["hyper-backend", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
web-time = "1"
zenwave = { version = "0.6.1", default-features = false }

[dev-dependencies]
num-traits = { version = "0.2", default-features = false }
pollster = "1.0"
# The `gpu` and `cpu` features add the `OffscreenRenderer` backends the
# offscreen snapshot test renders through (Metal GPU and CPU rasterizer).
waterui-graphics = { version = "0.5.0", features = ["cpu", "gpu"] }
# `tests/map_semantics.rs` mounts through `waterui-testing` on the pinned
# Hydrolysis host.
waterui = "0.5.0"
waterui-testing = "0.5.0"

[package.metadata.waterui.permissions]
internet = { reason = "downloads map styles and vector tiles" }

[package.metadata.cargo-machete]
ignored = ["getrandom"]

# Registry dependencies do not carry their own patch table, so the framework's
# pins are repeated here for this graph to resolve the same sources as
# water-rs/waterui at `0e1ae10f`: every `waterui-*` crate this crate reaches,
# directly or transitively, is the same monorepo commit. Cherenkov, filtrate
# and hydrolysis live in that repository — the engine family under
# `graphics/` and the backend under `backends/hydrolysis` — so their
# requirements resolve there too (water-rs/waterui#1449).
[patch.crates-io]
# water-rs/waterui on `feat/1435-graphics-recorder`: `SceneContent` records
# into the `cherenkov_record` `Recorder` re-exported as `waterui_graphics::draw`
# and `SceneResources` registers through the target's `SceneBackend` /
# `ShaderBackend` registry, returning handles that name the plain ids — the
# render-target-neutral contract of water-rs/waterui#1435.
waterui = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }

# Split components at the revisions the pinned waterui workspace consumes.
# `hydrolysis` enters this graph only through `waterui-testing`, whose
# workspace dependency already resolves it in-tree at the same revision.
waterui-image = { git = "https://github.com/water-rs/image", rev = "87080fc2e06628eb990af9fdbfbc3b8a28af5acc" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "50a87217658e9cf40024bf50619c4d7555a6415b" }

# The engine and its filter crates live in the waterui repository under
# `graphics/` and resolve to the same revision as the rest of the graph.
cherenkov = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
cherenkov-cpu = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
cherenkov-gpu = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
filtrate = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
filtrate-core = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }
filtrate-derive = { git = "https://github.com/water-rs/waterui", rev = "0e1ae10ff934bc1aaeb61f519146ef8bd7d2debd" }

# The nami `kurbo` feature Cherenkov requires is unreleased (water-rs/nami#27);
# this revision is the one the pinned monorepo declares, and it contains the
# engine's own pin, so one nami serves both.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
# shaderloom's `runtime` feature is newer than its registry release; this is
# the rev the framework's own table pins.
shaderloom = { git = "https://github.com/water-rs/shaderloom", rev = "84c37c8314f1bb6d228fce30f78d94872247a18f" }

# water-rs/waterkit `feat/efv-frames` — one revision serves every waterkit
# crate the graph reaches so the shared types stay identical.
waterkit-build = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-codec = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-core = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-location = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-permission = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }
waterkit-video-core = { git = "https://github.com/water-rs/waterkit", rev = "925f2e1bdc1eab6c7eea62711ffd4bcef8113c96" }



# Mirrored from water-rs/waterui's workspace [patch.crates-io] (itself
# mirrored from the cherenkov workspace's table, water-rs/cherenkov#229).
# wgpu 30.0.1's Metal backend reads the address of the kCGColorSpace* globals
# instead of their value and crashes in CGColorSpaceCreateWithName whenever a
# surface negotiates Extended Display P3 or BT.2100 (gfx-rs/wgpu#10175, fixed on
# trunk, not yet released for v30). The fork carries only that backport on the
# v30.0.1 tag; drop these entries once wgpu-hal 30.0.2 ships it.
naga = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-wasm = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
