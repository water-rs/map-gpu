[package]
name = "waterui-map-gpu"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Lexo Liu <me@lexo.cool>"]
license = "Apache-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/water-rs/map-gpu"
description = "GPU-drawn MapLibre vector map realization for WaterUI"
keywords = ["map", "vector-tiles", "vello", "wgpu", "waterui"]
categories = ["gui", "graphics"]
build = "build.rs"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
multiple_crate_versions = "allow"

[dependencies]
blocking = "1.7.0"
bytemuck = "1.25"
executor-core = "0.7.1"
futures = "0.3"
futures-lite = "2.6"
geo = { version = "0.32", default-features = false }
geo-types = "0.7"
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
kurbo = "0.13"
lru = "0.16"
maplibre-expr = "0.3.2"
mvt-reader = "2.4.0"
nami = "0.11.2"
native-executor = "0.8.0"
parley = { version = "0.11", default-features = false, features = ["system"] }
peniko = "0.6"
rayon = "1.12"
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
shaderloom = "0.1.2"
thiserror = "2.0.19"
tracing = "0.1.44"
url = "2.5"
vello = "0.9"
waterui-core = { version = "0.3.2" }
waterui-graphics = { version = "0.4.1", features = ["gpu"] }
waterui-map = { version = "0.1.2" }
waterui-url = { version = "0.3.1", features = ["std"] }
wgpu = "29.0.4"

[build-dependencies]
shaderloom = { version = "0.1.2", features = ["build"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
zenwave = { version = "0.6.1", default-features = false, features = ["hyper-backend", "native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
zenwave = { version = "0.6.1", default-features = false, features = ["hyper-backend", "rustls"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(any(target_vendor = "apple", target_os = "android"))))'.dependencies]
zenwave = { version = "0.6.1", default-features = false, features = ["hyper-backend", "rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
web-time = "1"
zenwave = { version = "0.6.1", default-features = false }

[dev-dependencies]
num-traits = { version = "0.2", default-features = false }
pollster = "1.0"
waterui = "0.4.1"
waterui-testing = "0.4.1"

[package.metadata.waterui.permissions]
internet = { reason = "downloads map styles and vector tiles" }

[package.metadata.cargo-machete]
ignored = ["getrandom", "shaderloom"]

# Until the waterui 0.5.0 wave is on crates.io the framework comes from its
# release-candidate revision; every `waterui-*` crate this graph resolves is
# pinned to the same monorepo commit so the graph carries exactly one copy of
# each. The pinned manifests still carry their pre-release versions
# (waterui-core 0.3.2, waterui-graphics 0.4.1, waterui-map 0.1.2,
# waterui-url 0.3.1, waterui-macros 0.3.1), so the requirements above stay at
# the versions that revision satisfies — cargo rejects a `[patch]` whose
# manifest version does not match the requirement, and requirements of
# "0.5.0" can only be written once the bump exists. Moving every requirement
# to "0.5.0" is part of dropping this table when the release lands.
#
# The third-party pins below are the framework's own: the pinned
# `waterui-graphics` was built with these forks, and git dependencies do not
# carry their own patch table, so they are repeated here.
[patch.crates-io]
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-map = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }

# The dev-dependency test graph (`tests/map_semantics.rs`) widens the same
# pin: `waterui-testing` mounts views on Hydrolysis, and the facade, the
# testing harness, and the two backend crates name every framework member
# below through registry requirements — each one resolves to the same
# monorepo commit so the graph still carries exactly one copy of each.
waterui = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-assets = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-assets-core = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-assets-macros = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-assets-planner = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-dylib = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-inspector-protocol = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-media = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-preview-protocol = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-testing = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-watcher-set = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }
waterui-webview = { git = "https://github.com/water-rs/waterui", rev = "f004c2fd86280ddf678124c59d984868a9d3f4c6" }

# Same-wave satellites the pinned revision names: the backend pair
# `waterui-testing` requires, and the extracted crates the facade reaches
# through registry requirements. The revisions are the ones the pinned
# monorepo's own `[patch.crates-io]` declares — except `hydrolysis` and
# `hydrolysis-m3`: the monorepo's pins predate its `DeviceLoss` addition to
# `GpuContext::new` and no longer build against f004c2f, so these are the
# first revisions whose own patch tables pin f004c2f.
hydrolysis = { git = "https://github.com/water-rs/hydrolysis", rev = "1d88f06abd9acf727a19eaa2d3743670493f6547" }
hydrolysis-m3 = { git = "https://github.com/water-rs/hydrolysis-m3", rev = "6a9981926ba3af16bed33b179365ff2d8a85ed05" }
waterui-image = { git = "https://github.com/water-rs/image", rev = "646d2eb1c7dda8c78283fd168e726fb260a84e65" }
waterui-svg = { git = "https://github.com/water-rs/svg", rev = "2272a62b4bcd7b3d1deb3ba03ba8a88ff927616a" }
vello = { git = "https://github.com/lexoliu/vello", rev = "5e5f538556be16527f67379b105af82f408b747d" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "d68d9e9825bcd1ffee762323881c13a2e7a3f639" }