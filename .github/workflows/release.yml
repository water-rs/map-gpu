name: Release

# Every push to `main` runs both jobs: `release` publishes unpublished crates
# (crates.io trusted publishing rejects OIDC tokens minted under
# `workflow_run`, and the required `CI result` check on `main` already
# guarantees the merged commit passed CI), and `release-pr` opens or refreshes
# the version bump and changelog pull request against `main`. Merging that
# pull request is the release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write

jobs:
  release:
    name: Release unpublished packages
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/linux-deps
      # The water-rs fork of release-plz (from release-plz-v0.3.161, the version
      # release-plz-action@v0.5 pins) treats a package it cannot compare with the
      # registry as changed instead of aborting: stock release-plz walks back to
      # the commit that last touched the crate and runs `cargo package` there, and
      # this crate's first commits still pointed at the monorepo workspace.
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: release-plz
          git: https://github.com/water-rs/release-plz
          rev: 3f421b280f377c2899f3a3750b4ad7a4f7e613c1
          locked: true
      - uses: release-plz/git-config@v0.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Mint a short-lived crates.io token from the GitHub OIDC identity
      # instead of a stored CARGO_REGISTRY_TOKEN (trusted publishing is
      # configured per crate on crates.io).
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - run: >-
          release-plz release
          --git-token "${GITHUB_TOKEN}"
          --repo-url "https://github.com/${GITHUB_REPOSITORY}"
          --forge github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  release-pr:
    name: Prepare the next release
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/linux-deps
      # The water-rs fork of release-plz (from release-plz-v0.3.161, the version
      # release-plz-action@v0.5 pins) treats a package it cannot compare with the
      # registry as changed instead of aborting: stock release-plz walks back to
      # the commit that last touched the crate and runs `cargo package` there, and
      # this crate's first commits still pointed at the monorepo workspace.
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: release-plz
          git: https://github.com/water-rs/release-plz
          rev: 3f421b280f377c2899f3a3750b4ad7a4f7e613c1
          locked: true
      - uses: release-plz/git-config@v0.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `-o json` prints the release pull request release-plz created or
      # updated, if any, on stdout and leaves the progress log on stderr.
      - id: release-plz
        run: |
          report=$(release-plz release-pr \
            --git-token "${GITHUB_TOKEN}" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}" \
            --forge github \
            -o json)
          echo "${report}"
          pr=$(jq -c '.prs[0] // empty' <<< "${report}")
          echo "pr=${pr}" >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub holds the pull request runs of a pull request the Actions bot
      # opened or pushed until they are approved, and the required
      # `CI result` reports only from those runs.
      - name: Approve the release PR's CI
        if: steps.release-plz.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: bash .github/scripts/approve-held-runs.sh "$(jq -er .number <<<"$PR")"
