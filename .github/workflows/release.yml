name: Release

on:
  # crates.io trusted publishing rejects OIDC tokens minted under
  # `workflow_run`, so publishing runs on the `main` push itself — which
  # can only come from a merged pull request (the dev -> main release PR)
  # whose required checks already passed on the same tree. `release-pr`
  # still waits for CI via `workflow_run`.
  push:
    branches: [main]
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release unpublished packages
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/linux-deps
      # The water-rs fork of release-plz (from release-plz-v0.3.161, the version
      # release-plz-action@v0.5 pins) treats a package it cannot compare with the
      # registry as changed instead of aborting: stock release-plz walks back to
      # the commit that last touched the crate and runs `cargo package` there, and
      # this crate's first commits still pointed at the monorepo workspace.
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: release-plz
          git: https://github.com/water-rs/release-plz
          rev: cc554a52e97e0ee359e45c7801d770895247cf27
          locked: true
      - uses: release-plz/git-config@v0.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Mint a short-lived crates.io token from the GitHub OIDC identity
      # instead of a stored CARGO_REGISTRY_TOKEN (trusted publishing is
      # configured per crate on crates.io).
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      - run: >-
          release-plz release
          --git-token "${GITHUB_TOKEN}"
          --repo-url "https://github.com/${GITHUB_REPOSITORY}"
          --forge github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  release-pr:
    name: Prepare the next release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    concurrency:
      group: release-plz-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/linux-deps
      # The water-rs fork of release-plz (from release-plz-v0.3.161, the version
      # release-plz-action@v0.5 pins) treats a package it cannot compare with the
      # registry as changed instead of aborting: stock release-plz walks back to
      # the commit that last touched the crate and runs `cargo package` there, and
      # this crate's first commits still pointed at the monorepo workspace.
      - uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: release-plz
          git: https://github.com/water-rs/release-plz
          rev: cc554a52e97e0ee359e45c7801d770895247cf27
          locked: true
      - uses: release-plz/git-config@v0.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: >-
          release-plz release-pr
          --git-token "${GITHUB_TOKEN}"
          --repo-url "https://github.com/${GITHUB_REPOSITORY}"
          --forge github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

