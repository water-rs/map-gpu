name: Release preflight

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semver:
    name: Local API vs published baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        uses: ./.github/actions/linux-deps
      # cherenkov-gpu's build script optimizes its precompiled SPIR-V with spirv-opt.
      - name: Install SPIRV-Tools
        run: sudo apt-get update && sudo apt-get install -y spirv-tools
      - id: baseline
        run: |
          set -euo pipefail
          if curl -sfL https://index.crates.io/wa/te/waterui-map-gpu | grep -q '"yanked":false'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No unyanked waterui-map-gpu on crates.io; this release establishes the baseline."
          fi
      - if: steps.baseline.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
